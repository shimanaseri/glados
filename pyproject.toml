[project]
name = "glados"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shima Naseri", email = "shima.s.naseri@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-ollama>=1.1.0",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core==1.13.8",
    "sounddevice>=0.5.6",
    "textual>=1.0.0",
]

[project.scripts]
glados = "glados.cli:main"
glados-download-voice = "glados.voice_setup:main"
glados-tui = "glados.tui:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
